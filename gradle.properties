# This file is for configuring the build environment
# Settings for how Gradle runs: parallel, caching, JVM memory/encoding,...
# Never put versions (use gradle/libs.versions.toml) or secrets (this file is committed) here


# Run tasks of different subprojects at the same time
org.gradle.parallel=true

# Turn on the build cache: reuse task outputs from earlier builds
org.gradle.caching=true

# JVM settings for the Gradle daemon (English messages, UTF-8 files)
org.gradle.jvmargs=-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
